<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="google" content="notranslate" />
<title>Baby Pool — Place your bet!</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #f6f4ee;
    --cream-2: #efece2;
    --sage: #9aa982;
    --sage-deep: #7d8d68;
    --peach: #e6b99a;
    --peach-soft: #f0d3bf;
    --ink: #5c5a52;
    --ink-soft: #837f74;
    --sun: #f4cf6a;
    --pink: #e7b6b0;
    --card: rgba(255, 255, 255, 0.82);
    --shadow: 0 18px 40px -18px rgba(120, 110, 90, 0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: "Quicksand", sans-serif;
    color: var(--ink);
    background: var(--cream-2);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    position: relative;
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 22mm 18mm 18mm;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    background:
      radial-gradient(1200px 600px at 80% -5%, #fff7e6 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 20%, #eef2e6 0%, transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
  }

  /* --- bunting --- */
  .bunting {
    display: flex; justify-content: center; gap: 6px;
    margin-bottom: 14px;
  }
  .flag {
    width: 0; height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 26px solid var(--sage);
    filter: drop-shadow(0 6px 6px rgba(120,110,90,.18));
  }
  .flag:nth-child(odd) { border-top-color: var(--peach); }
  .flag:nth-child(3n)  { border-top-color: var(--sun); }

  .eyebrow {
    font-weight: 700;
    letter-spacing: .28em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--sage-deep);
    margin-bottom: 4px;
  }

  .title {
    font-family: "Pacifico", cursive;
    font-size: 64px;
    line-height: 1.05;
    color: var(--sage-deep);
    margin-bottom: 6px;
  }

  .names {
    font-family: "Pacifico", cursive;
    font-size: 30px;
    color: var(--peach);
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 16px;
  }
  .names .sep { color: var(--ink-soft); font-family: "Quicksand", sans-serif; font-weight: 600; }
  .names .heart { color: var(--pink); font-size: 22px; }

  .intro {
    font-size: 19px;
    font-weight: 600;
    color: var(--ink);
    max-width: 480px;
    line-height: 1.5;
    margin-bottom: 4px;
  }
  .intro .glory { color: var(--sage-deep); font-weight: 700; }

  /* --- guess chips --- */
  .chips {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    max-width: 470px;
    margin: 18px 0 6px;
  }
  .chip {
    background: var(--card);
    border: 1px solid rgba(154, 169, 130, 0.35);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    box-shadow: 0 6px 14px -10px rgba(120,110,90,.5);
  }
  .chip .dot { color: var(--peach); font-weight: 700; }

  /* --- QR card --- */
  .qr-card {
    margin-top: 34px;
    background: #fff;
    border-radius: 32px;
    padding: 34px 34px 26px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(154, 169, 130, 0.25);
  }
  .qr-card .scan {
    font-family: "Pacifico", cursive;
    font-size: 32px;
    color: var(--sage-deep);
    margin-bottom: 20px;
  }
  .qr-box {
    width: 420px; height: 420px;
    padding: 14px;
    background: #fff;
    border-radius: 18px;
    margin: 0 auto;
  }
  .qr-box svg { width: 100%; height: 100%; display: block; }

  .url {
    margin-top: 20px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--ink-soft);
  }
  .url .path { color: var(--sage-deep); }

  .steps {
    margin-top: 22px;
    display: flex; gap: 22px; justify-content: center; flex-wrap: wrap;
    font-size: 14px; font-weight: 600; color: var(--ink-soft);
  }
  .steps .step { display: flex; align-items: center; gap: 7px; }
  .steps .n {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--sage-deep); color: #fff; font-size: 13px; font-weight: 700;
  }

  .footer {
    margin-top: auto;
    padding-top: 24px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .footer .date { color: var(--sage-deep); font-weight: 700; }

  @media screen {
    body { padding: 24px 0; }
    .sheet { box-shadow: 0 30px 60px -30px rgba(120,110,90,.55); border-radius: 6px; }
  }

  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; padding: 0; }
    .sheet { box-shadow: none; }
  }
</style>
</head>
