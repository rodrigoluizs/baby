<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- the site ships PT/EN/DE natively; browser auto-translate rewrites the DOM and corrupts the labels -->
<meta name="google" content="notranslate" />
<title>Baby Shower Nico/Luna</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%239aa982'/><path transform='translate(4 4)' d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z' fill='%23ffffff'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #f6f4ee;
    --cream-2: #efece2;
    --sage: #9aa982;
    --sage-deep: #7d8d68;
    --peach: #e6b99a;
    --peach-soft: #f0d3bf;
    --ink: #5c5a52;
    --ink-soft: #837f74;
    --sun: #f4cf6a;
    --pink: #e7b6b0;
    --card: rgba(255, 255, 255, 0.72);
    --shadow: 0 18px 40px -18px rgba(120, 110, 90, 0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: "Quicksand", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 80% -5%, #fff7e6 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 20%, #eef2e6 0%, transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* sticky header */
  .topbar {
    position: sticky; top: 0; z-index: 60;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 16px;
    background: rgba(246, 244, 238, 0.82);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(120, 110, 90, 0.10);
  }
  .topnav { display: flex; align-items: center; gap: 6px; }
  .topnav a {
    text-decoration: none;
    color: var(--ink);
    font-weight: 600;
    font-size: .92rem;
    padding: 8px 14px;
    border-radius: 999px;
    transition: background .2s ease, color .2s ease;
  }
  .topnav a:hover { background: rgba(154, 169, 130, 0.18); color: var(--sage-deep); }
  .topnav a.topnav-cta {
    background: var(--sage-deep);
    color: #fff;
  }
  .topnav a.topnav-cta:hover { background: var(--sage); color: #fff; }

  /* language switcher */
  .lang {
    display: flex; gap: 4px; flex-shrink: 0;
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 999px; padding: 4px;
  }
  .lang button {
    border: 0; background: transparent; cursor: pointer;
    font-family: "Quicksand", sans-serif; font-weight: 700;
    color: var(--ink-soft); font-size: .8rem;
    padding: 7px 12px; border-radius: 999px; transition: all .2s ease;
  }
  .lang button:hover { color: var(--sage-deep); }
  .lang button.active { background: var(--sage-deep); color: #fff; }

  /* floating decorative emojis */
  .floaties { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .floatie {
    position: absolute;
    font-size: clamp(1.6rem, 4vw, 3rem);
    opacity: 0.85;
    animation: drift linear infinite;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.06));
  }
  .floatie svg { width: 1em; height: 1em; stroke-width: 1.6; }
  @keyframes drift {
    0%   { transform: translateY(0) rotate(0deg); }
    50%  { transform: translateY(-22px) rotate(8deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  .wrap { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 0 22px; }

  /* HERO */
  header.hero {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    padding: 60px 22px;
  }

  .bunting {
    display: flex;
    gap: 0;
    margin-bottom: 26px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
  }
  .flag {
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 26px solid var(--sage);
    margin: 0 -1px;
    transform-origin: top center;
    animation: sway 3.5s ease-in-out infinite;
  }
  .flag:nth-child(odd)  { border-top-color: var(--peach); animation-delay: .3s; }
  .flag:nth-child(3n)   { border-top-color: var(--sun); animation-delay: .6s; }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

  .eyebrow {
    font-size: clamp(.9rem, 2.5vw, 1.1rem);
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--sage-deep);
    font-weight: 600;
  }

  h1.title {
    font-family: "Pacifico", cursive;
    font-weight: 400;
    color: var(--sage-deep);
    font-size: clamp(3.4rem, 12vw, 7rem);
    line-height: 1;
    margin: 10px 0 4px;
    text-shadow: 0 4px 0 rgba(255,255,255,.6);
  }

  .babyname-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 34px;
  }
  .babyname {
    font-family: "Pacifico", cursive;
    color: var(--peach);
    font-size: clamp(1.6rem, 6vw, 3rem);
  }
  .babyname .name-sep { color: var(--peach); font-family: "Quicksand", sans-serif; }
  .name-ico {
    width: clamp(32px, 7vw, 52px);
    height: clamp(32px, 7vw, 52px);
    stroke-width: 1.7;
    flex-shrink: 0;
    animation: bob 2.6s ease-in-out infinite;
  }
  .name-ico-left  { color: var(--sage-deep); }
  .name-ico-right { color: var(--pink); animation-delay: .5s; }

  .subtitle {
    margin-top: 18px;
    font-size: clamp(1.05rem, 3vw, 1.4rem);
    color: var(--ink-soft);
    font-weight: 500;
    max-width: 30ch;
  }

  .hero-animals {
    margin-top: 28px;
    display: flex;
    gap: 22px;
  }
  .hero-animals svg { width: clamp(42px, 9vw, 62px); height: clamp(42px, 9vw, 62px); stroke-width: 1.7; }
  .hero-animals span:nth-child(1) svg { color: var(--peach); }
  .hero-animals span:nth-child(2) svg { color: #e6b94c; }
  .hero-animals span { animation: bob 2.6s ease-in-out infinite; display: flex; }
  .hero-animals span:nth-child(2){ animation-delay:.4s; }
  .hero-animals span:nth-child(3){ animation-delay:.8s; }
  .hero-animals span:nth-child(4){ animation-delay:1.2s; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }


  /* DATE + COUNTDOWN */
  .date-card {
    background: var(--card);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 38px 28px;
    text-align: center;
    margin-top: -40px;
  }
  .big-date {
    font-size: clamp(2.6rem, 9vw, 4.6rem);
    font-weight: 700;
    color: var(--sage-deep);
    letter-spacing: .02em;
  }
  .big-date span { color: var(--peach); }
  .when { font-size: clamp(1.1rem, 3.5vw, 1.6rem); color: var(--ink-soft); font-weight: 600; margin-top: 4px; }

  .countdown { display: flex; justify-content: center; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .cd-box {
    background: linear-gradient(180deg, #fff, #f7f3ea);
    border-radius: 18px;
    padding: 14px 10px;
    min-width: 78px;
    box-shadow: 0 10px 22px -14px rgba(120,110,90,.5);
  }
  .cd-num { font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 700; color: var(--sage-deep); }
  .cd-lbl { font-size: .72rem; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-soft); }

  section { padding: 56px 0 10px; }
  section[id], .rsvp-banner { scroll-margin-top: 72px; }
  .section-title {
    font-family: "Pacifico", cursive;
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    color: var(--sage-deep);
    text-align: center;
    margin-bottom: 26px;
  }

  /* INFO CARDS */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .cards.has-pool { grid-template-columns: repeat(2, 1fr); }
  .card {
    background: var(--card);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 24px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: var(--shadow);
    transition: transform .25s ease, box-shadow .25s ease;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 26px 50px -20px rgba(120,110,90,.55); }
  .card .ico {
    width: 66px; height: 66px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 6px;
    box-shadow: 0 10px 20px -10px rgba(120,110,90,.55);
  }
  .card .ico svg { width: 30px; height: 30px; color: #fff; stroke-width: 2; }
  .ico-sage  { background: linear-gradient(135deg, var(--sage), var(--sage-deep)); }
  .ico-peach { background: linear-gradient(135deg, var(--peach), #d99e78); }
  .ico-sun   { background: linear-gradient(135deg, #f6d77a, #e6b94c); }
  .ico-pink  { background: linear-gradient(135deg, var(--pink), #d69a92); }
  .card h3 { margin: 12px 0 6px; font-size: 1.25rem; color: var(--sage-deep); }
  .card p { font-size: .95rem; color: var(--ink-soft); }
  .card .cta { display:inline-block; margin-top:12px; font-weight:700; color: var(--peach); }

  /* REMINDERS */
  .reminders {
    background: var(--card);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 34px 30px;
  }
  .reminders ul { list-style: none; display: grid; gap: 16px; }
  .reminders li { display: flex; gap: 14px; align-items: flex-start; font-size: 1.05rem; }
  .reminders li .r-ico { line-height: 1; flex-shrink: 0; display: flex; }
  .reminders li .r-ico svg { width: 24px; height: 24px; color: var(--sage-deep); stroke-width: 2; }
  .reminders .highlight { color: var(--peach); font-weight: 700; }
  .map-embed {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 14px 30px -16px rgba(120,110,90,.55);
    margin-bottom: 20px;
    border: 3px solid #fff;
  }
  .map-embed iframe { width: 100%; height: 320px; border: 0; display: block; }
  .loc-details { display: flex; flex-direction: column; gap: 8px; align-items: center; margin: 6px 0 4px; }
  .loc-details p { display: flex; align-items: center; gap: 8px; font-size: 1rem; color: var(--ink-soft); }
  .loc-details svg { width: 20px; height: 20px; color: var(--sage-deep); stroke-width: 2; flex-shrink: 0; }
  .inline-pin { color: var(--peach); width: 26px; height: 26px; stroke-width: 2; }
  .txt-ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.18em; stroke-width: 2; }
  .heart-pink { color: var(--pink); fill: var(--pink); }

  /* RSVP banner */
  .rsvp-banner {
    text-align: center;
    margin: 46px 0 10px;
    padding: 40px 26px;
    border-radius: 28px;
    background: linear-gradient(135deg, var(--sage) 0%, var(--sage-deep) 100%);
    color: #fff;
    box-shadow: var(--shadow);
  }
  .rsvp-banner h2 { font-family: "Pacifico", cursive; font-weight: 400; font-size: clamp(1.8rem,6vw,2.6rem); }
  .rsvp-banner p { opacity: .92; margin-top: 8px; }
  .btn {
    display: inline-block;
    margin-top: 20px;
    background: #fff;
    color: var(--sage-deep);
    font-weight: 700;
    padding: 14px 34px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 12px 24px -10px rgba(0,0,0,.35);
    transition: transform .2s ease;
  }
  .btn:hover { transform: scale(1.05); }
  .deadline { margin-top: 14px; font-size: .9rem; opacity: .9; }

  .map-btn {
    display: inline-block;
    margin-top: 16px;
    background: var(--sage-deep);
    color: #fff;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 12px 24px -12px rgba(120,110,90,.6);
    transition: transform .2s ease;
  }
  .map-btn:hover { transform: scale(1.05); }
  .gift-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .map-btn-alt { background: linear-gradient(135deg, var(--peach), #d99e78); }

  footer { text-align: center; padding: 50px 22px 60px; color: var(--ink-soft); }
  footer .hearts { display: flex; justify-content: center; gap: 14px; }
  footer .hearts svg { width: 28px; height: 28px; stroke-width: 1.8; }
  footer .hearts i:nth-child(1) svg { color: var(--sage-deep); }
  footer .hearts i:nth-child(2) svg { color: var(--pink); }
  footer .hearts i:nth-child(3) svg { color: var(--peach); }

  @media (max-width: 640px) {
    .cards { grid-template-columns: 1fr; }
    .topbar { padding: 8px 10px; gap: 8px; }
    .topnav { gap: 2px; }
    .topnav a { font-size: .82rem; padding: 7px 10px; }
    .lang button { padding: 6px 9px; font-size: .74rem; }
  }

  /* gentle entrance */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }

  /* BETTING POOL */
  [hidden] { display: none !important; }
  body.pool-open { overflow: hidden; }
  .pool-page {
    position: fixed; inset: 0; z-index: 100;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background:
      radial-gradient(1200px 600px at 80% -5%, #fff7e6 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 20%, #eef2e6 0%, transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
  }
  .pool-wrap { max-width: 680px; margin: 0 auto; padding: 16px 22px 60px; }
  .pool-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .pool-page-title { margin: 14px 0 22px; }
  .pool-exit {
    border: 0; background: rgba(255,255,255,.6); cursor: pointer;
    font-family: "Quicksand", sans-serif; font-weight: 700; font-size: .92rem;
    color: var(--sage-deep); padding: 9px 16px; border-radius: 999px;
    box-shadow: 0 8px 18px -12px rgba(120,110,90,.5);
  }
  .pool-exit:hover { background: #fff; }
  .pool-card { text-align: center; }
  .pool-intro-txt { color: var(--ink-soft); max-width: 46ch; margin: 0 auto 20px; }
  .pool-name {
    width: 100%; max-width: 340px;
    font-family: "Quicksand", sans-serif; font-size: 1.1rem; font-weight: 600;
    color: var(--ink); text-align: center;
    padding: 14px 18px; margin-bottom: 16px;
    border: 2px solid rgba(154, 169, 130, .45); border-radius: 16px;
    background: #fff; outline: none;
    transition: border-color .2s ease;
  }
  .pool-name:focus { border-color: var(--sage-deep); }
  .pool-btn {
    display: inline-block;
    border: 0; cursor: pointer;
    font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 1.05rem;
    background: var(--sage-deep); color: #fff;
    padding: 14px 34px; border-radius: 999px;
    box-shadow: 0 12px 24px -12px rgba(120,110,90,.6);
    transition: transform .2s ease, opacity .2s ease;
  }
  .pool-btn:hover:not(:disabled) { transform: scale(1.05); }
  .pool-btn:disabled { opacity: .55; cursor: default; }
  .pool-btn-peach { background: linear-gradient(135deg, var(--peach), #d99e78); }
  .pool-tabs {
    display: flex; gap: 4px;
    background: rgba(120,110,90,.08);
    border-radius: 999px; padding: 4px;
    max-width: 320px; margin: 0 auto 22px;
  }
  .pool-tab {
    flex: 1; border: 0; background: transparent; cursor: pointer;
    font-family: "Quicksand", sans-serif; font-weight: 700; font-size: .95rem;
    color: var(--ink-soft); padding: 10px 12px; border-radius: 999px;
    transition: all .2s ease;
  }
  .pool-tab:hover { color: var(--sage-deep); }
  .pool-tab.active { background: var(--sage-deep); color: #fff; }

  .pool-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; min-height: 34px; }
  .pool-back {
    border: 0; background: transparent; cursor: pointer;
    font-family: "Quicksand", sans-serif; font-weight: 700; font-size: .95rem;
    color: var(--sage-deep); padding: 6px 10px; border-radius: 999px;
  }
  .pool-back:hover { background: rgba(154,169,130,.15); }
  .pool-count { font-size: .85rem; font-weight: 700; color: var(--ink-soft); letter-spacing: .08em; }
  .pool-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .pool-dot {
    width: 10px; height: 10px; border-radius: 50%; border: 0; padding: 0;
    background: rgba(120,110,90,.22); cursor: default;
  }
  .pool-dot.done { background: var(--sage); cursor: pointer; }
  .pool-dot.now { background: var(--sage-deep); transform: scale(1.35); }

  .pool-q { font-size: clamp(1.25rem, 4.5vw, 1.6rem); font-weight: 700; color: var(--sage-deep); margin-bottom: 6px; }
  .pool-note { font-size: .9rem; color: var(--ink-soft); margin-bottom: 16px; }
  .pool-opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 460px; margin: 14px auto 0; }
  .pool-opts.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .pool-opts.cols-3 .pool-opt { font-size: .92rem; padding: 14px 4px; }
  .pool-opt {
    border: 2px solid rgba(154,169,130,.4); border-radius: 18px;
    background: #fff; cursor: pointer;
    font-family: "Quicksand", sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--ink);
    padding: 16px 10px; min-height: 58px;
    overflow-wrap: break-word;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .pool-opt small { display: block; font-size: .78rem; font-weight: 600; color: var(--ink-soft); margin-top: 2px; }
  .pool-opt:hover { border-color: var(--sage-deep); }
  .pool-opt.sel { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }
  .pool-opt.sel small { color: rgba(255,255,255,.85); }
  .pool-opt-ico { width: 24px; height: 24px; stroke-width: 2; display: block; margin: 0 auto 6px; }
  .pool-opt.sel .pool-opt-ico { color: #fff !important; }
  .pool-val-ico { width: 16px; height: 16px; stroke-width: 2.2; display: inline-block; vertical-align: -3px; margin-right: 5px; }
  .pool-ico-blue { color: #7fa7cc; }
  .pool-ico-pink { color: var(--pink); }
  .pool-ico-sun { color: #e6b94c; }
  .pool-ico-moon { color: #8a93b8; }
  .pool-ico-peach { color: var(--peach); }
  .pool-ico-sage { color: var(--sage-deep); }
  .pool-ico-brown { color: #a3785a; }
  .pool-ico-black { color: #55524b; }
  .pool-star { width: 15px; height: 15px; stroke-width: 2; color: #e6b94c; fill: #e6b94c; vertical-align: -2px; display: inline-block; }
  .ico-gold { color: #e6b94c; }
  .ico-party { color: var(--peach); }

  .pool-stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 22px 0 26px; }
  .pool-step-btn {
    width: 62px; height: 62px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--sage-deep); color: #fff; font-size: 1.9rem; font-weight: 700; line-height: 1;
    box-shadow: 0 10px 20px -10px rgba(120,110,90,.6);
    transition: transform .15s ease, opacity .15s ease;
    touch-action: manipulation;
  }
  .pool-step-btn:active { transform: scale(.92); }
  .pool-step-btn:disabled { opacity: .35; cursor: default; }
  .pool-step-val { font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 700; color: var(--sage-deep); min-width: 150px; }
  .pool-step-val small { font-size: .5em; color: var(--ink-soft); font-weight: 600; }

  .pool-review { max-width: 460px; margin: 16px auto 20px; display: grid; gap: 10px; text-align: left; }
  .pool-rrow {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 2px solid rgba(154,169,130,.3); border-radius: 16px;
    background: #fff; cursor: pointer;
    font-family: "Quicksand", sans-serif;
    padding: 12px 16px;
    transition: border-color .15s ease;
  }
  .pool-rrow:hover { border-color: var(--sage-deep); }
  .pool-rrow.ro { cursor: default; }
  .pool-rrow.ro:hover { border-color: rgba(154,169,130,.3); }
  .pool-rrow .k { font-size: .85rem; font-weight: 600; color: var(--ink-soft); }

  .pool-rrow .v svg { width: 16px; height: 16px; color: var(--sage-deep); stroke-width: 2.4; }
  .pool-err { color: #b0645c; font-weight: 600; margin: 12px 0; }
  .pool-spin {
    width: 34px; height: 34px; margin: 24px auto;
    border: 4px solid rgba(154,169,130,.3); border-top-color: var(--sage-deep);
    border-radius: 50%; animation: poolspin .8s linear infinite;
  }
  @keyframes poolspin { to { transform: rotate(360deg); } }

  /* pool results */
  .pool-sub { color: var(--ink-soft); font-weight: 600; margin-bottom: 20px; }
  .pool-stats { display: grid; gap: 22px; max-width: 520px; margin: 0 auto; text-align: left; }
  .pool-stat h4 { font-size: .95rem; color: var(--sage-deep); margin-bottom: 8px; }
  /* label column sizes to the longest label per category; the bar shrinks with the screen */
  .pool-bar-rows {
    display: grid; grid-template-columns: max-content minmax(40px, 1fr) max-content;
    column-gap: 10px; row-gap: 8px; align-items: center; font-size: .9rem;
  }
  .pool-bar-row { display: contents; }
  .pool-bar-lbl { font-weight: 600; color: var(--ink); white-space: nowrap; max-width: 55vw; overflow: hidden; text-overflow: ellipsis; }
  .pool-bar-track { height: 14px; border-radius: 999px; background: rgba(120,110,90,.14); overflow: hidden; }
  .pool-bar-fill { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--sage), var(--sage-deep)); transition: width .6s ease; }
  .pool-bar-pct { text-align: right; font-weight: 700; color: var(--ink-soft); font-size: .85rem; }
  .pool-avgs { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .pool-avg-box {
    background: linear-gradient(180deg, #fff, #f7f3ea);
    border-radius: 18px; padding: 14px 22px; min-width: 130px; text-align: center;
    box-shadow: 0 10px 22px -14px rgba(120,110,90,.5);
  }
  .pool-avg-box .n { font-size: 1.5rem; font-weight: 700; color: var(--sage-deep); }
  .pool-avg-box .l { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }

  .pool-table-wrap { overflow-x: auto; margin-top: 14px; -webkit-overflow-scrolling: touch; }
  .pool-table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: .85rem; text-align: left; }
  .pool-table th {
    font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-soft); padding: 8px 10px; border-bottom: 2px solid rgba(120,110,90,.18);
    white-space: nowrap;
  }
  .pool-table td { padding: 9px 10px; border-bottom: 1px solid rgba(120,110,90,.1); white-space: nowrap; }
  .pool-table tr.me td { background: rgba(154,169,130,.16); font-weight: 700; }
  /* keep the name readable while the table scrolls horizontally */
  .pool-table th:first-child, .pool-table td:first-child {
    position: sticky; left: 0; z-index: 2;
    background: #faf8f2;
    box-shadow: 4px 0 6px -4px rgba(120,110,90,.35);
  }
  .pool-table.ranked th:first-child, .pool-table.ranked td:first-child {
    min-width: 44px; max-width: 44px; box-shadow: none;
  }
  .pool-table.ranked th:nth-child(2), .pool-table.ranked td:nth-child(2) {
    position: sticky; left: 44px; z-index: 2;
    background: #faf8f2;
    box-shadow: 4px 0 6px -4px rgba(120,110,90,.35);
  }
  .pool-table tr.me td:first-child, .pool-table.ranked tr.me td:nth-child(2) { background: #eaebe0; }
  .pool-table td.pts { font-weight: 700; color: var(--sage-deep); }
  .pool-table td.zero { color: rgba(131,127,116,.55); }
  .pool-you-badge {
    display: inline-block; background: var(--sage-deep); color: #fff;
    font-size: .68rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; margin-left: 6px;
    vertical-align: 1px;
  }

  /* leaderboard */
  .pool-actual {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    margin: 6px 0 26px;
  }
  .pool-medal svg { width: 20px; height: 20px; stroke-width: 2.2; vertical-align: -4px; }
  .pool-medal-1 { color: #e6b94c; }
  .pool-medal-2 { color: #9aa4ad; }
  .pool-medal-3 { color: #c08552; }
  .pool-scoring { max-width: 520px; margin: 22px auto 0; text-align: left; }
  .pool-scoring summary { cursor: pointer; font-weight: 700; color: var(--sage-deep); font-size: .95rem; }
  .pool-scoring p { font-size: .88rem; color: var(--ink-soft); margin-top: 10px; }

  @media (max-width: 640px) {
    .cards.has-pool { grid-template-columns: 1fr; }
    .pool-bar-rows { font-size: .82rem; column-gap: 8px; }
    .pool-bar-pct { font-size: .8rem; }

  function applyLang(lang, persist) {
    const dict = I18N[lang] || I18N.pt;
    document.documentElement.lang = dict._htmlLang;
    if (dict.docTitle) document.title = dict.docTitle;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      const key = el.getAttribute("data-i18n");
      if (dict[key] != null) el.innerHTML = dict[key];
    });
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-lang") === lang);
    });
    if (window.lucide) lucide.createIcons();
    // only an explicit choice is remembered; auto-detection re-runs on every visit,
    // so the site follows the device language until the user picks one
    if (persist) { try { localStorage.setItem("bs_lang", lang); } catch (e) {} }
    window.CURRENT_LANG = lang;
    document.dispatchEvent(new CustomEvent("langchange"));
  }

  (function initLang() {

    function detectBrowserLang() {
      const prefs = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || ""];
      for (let i = 0; i < prefs.length; i++) {
        const code = prefs[i].slice(0, 2).toLowerCase();
        if (I18N[code]) return code;
      }
      return "en"; // default
    }

    const initial = (saved && I18N[saved]) ? saved : detectBrowserLang();
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.addEventListener("click", function () { applyLang(b.getAttribute("data-lang"), true); });
    });
    applyLang(initial);
  })();

      mins: document.getElementById("cd-mins"),
      secs: document.getElementById("cd-secs"),
    };
    function pad(n) { return String(n).padStart(2, "0"); }
    function tick() {
      const diff = target - Date.now();
      if (diff <= 0) {
        els.days.textContent = els.hours.textContent = els.mins.textContent = els.secs.textContent = "00";
        return;
      }
      els.days.textContent = Math.floor(diff / 86400000);
      els.hours.textContent = pad(Math.floor((diff % 86400000) / 3600000));
      els.mins.textContent = pad(Math.floor((diff % 3600000) / 60000));
      els.secs.textContent = pad(Math.floor((diff % 60000) / 1000));
    }
    tick();

    const colors = ["#9aa982", "#e6b99a", "#f4cf6a", "#e7b6b0", "#7d8d68"];
    for (let i = 0; i < 60; i++) {
        const c = document.createElement("div");
        c.style.position = "fixed";
        c.style.left = x + "px";
        c.style.top = y + "px";
        c.style.width = "10px";
        c.style.height = "10px";
        c.style.background = colors[i % colors.length];
        c.style.borderRadius = Math.random() > .5 ? "50%" : "2px";
        c.style.pointerEvents = "none";
        c.style.zIndex = 9999;
        document.body.appendChild(c);
        const angle = Math.random() * Math.PI * 2;
        const velocity = 4 + Math.random() * 6;
        let vx = Math.cos(angle) * velocity;
        let vy = Math.sin(angle) * velocity - 6;
        let px = 0, py = 0, op = 1;
        const id = setInterval(function () {
          vy += 0.35;
          px += vx; py += vy; op -= 0.018;
          c.style.transform = "translate(" + px + "px," + py + "px) rotate(" + (px * 4) + "deg)";

          if (op <= 0) { clearInterval(id); c.remove(); }

        function refresh() {
          document.getElementById("pool-val").textContent = step.fmt(state.answers[step.key]);
          minus.disabled = state.answers[step.key] <= step.min;
          plus.disabled = state.answers[step.key] >= step.max;
        }
        minus.addEventListener("click", function () {
          state.answers[step.key] = Math.max(step.min, state.answers[step.key] - step.step); refresh();
        });
        plus.addEventListener("click", function () {
          state.answers[step.key] = Math.min(step.max, state.answers[step.key] + step.step); refresh();
        });
        document.getElementById("pool-next").addEventListener("click", advance);
        refresh();
      }
    }

    function renderReview() {
      setContent(
        '<p class="pool-q">' + t("pool_review_h") + "</p>" +
        '<p class="pool-note">' + t("pool_review_sub") + "</p>" +
        '<div class="pool-review">' +
        '<div class="pool-rrow" data-edit="name"><span class="k">' + t("pool_name_col") + '</span><span class="v">' + esc(state.name) + ' <i data-lucide="pencil"></i></span></div>' +
        STEPS.map(function (s, i) {
          return '<div class="pool-rrow" data-edit="' + i + '"><span class="k">' + t("pool_cat_" + s.key) + '</span>' +
            '<span class="v">' + displayVal(s.key, state.answers[s.key]) + ' <i data-lucide="pencil"></i></span></div>';
        }).join("") +
        "</div>" +
        (state.err ? '<p class="pool-err">' + t("pool_submit_err") + "</p>" : "") +
        '<button class="pool-btn pool-btn-peach" id="pool-submit">' + t(state.err ? "pool_retry" : "pool_submit") + "</button>");
      box.querySelectorAll("[data-edit]").forEach(function (row) {
        row.addEventListener("click", function () {
          const target = row.getAttribute("data-edit");
          if (target === "name") { state.mode = "intro"; }
          else { state.mode = "step"; state.step = Number(target); state.fromReview = true; }
          render();
        });
      });
      document.getElementById("pool-submit").addEventListener("click", submit);
    }

    function renderSending() {
      setContent('<div class="pool-spin"></div><p class="pool-sub">' + t("pool_sending") + "</p>");
    }

    function renderDone() {
      setContent(
        '<p class="pool-q">' + t("pool_success") + "</p>" +
        '<p class="pool-note">' + t("pool_done_sub") + "</p>" +
        '<div class="pool-review">' +
        '<div class="pool-rrow ro"><span class="k">' + t("pool_name_col") + '</span><span class="v">' + esc(saved.name) + "</span></div>" +
        STEPS.map(function (s) {
          return '<div class="pool-rrow ro"><span class="k">' + t("pool_cat_" + s.key) + '</span>' +
            '<span class="v">' + displayVal(s.key, saved.bet[s.key]) + "</span></div>";
        }).join("") + "</div>");
    }

    function renderLoading() {
      setContent('<div class="pool-spin"></div><p class="pool-sub">' + t("pool_loading") + "</p>");
    }

    function renderLoadErr() {
      setContent('<p class="pool-err">' + t("pool_load_err") + "</p>" +
        '<button class="pool-btn" id="pool-reload">' + t("pool_retry") + "</button>");
      document.getElementById("pool-reload").addEventListener("click", function () {
        state.rmode = "loading"; render(); loadResults();
      });
    }

    // ---- submit & load ----
    function submit() {
      state.mode = "sending"; state.err = false; render();
      const payload = Object.assign({ name: state.name, lang: window.CURRENT_LANG }, state.answers);
      fetch(POOL_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.error || "server error");
          saved = { name: state.name, bet: state.answers, ts: Date.now() };
          try { localStorage.setItem("bs_pool_bet", JSON.stringify(saved)); } catch (e) {}
          const r = box.getBoundingClientRect();
          confettiBurst(r.left + r.width / 2, Math.max(90, r.top + 60));
          state.mode = "done";
          state.tab = "results"; state.rmode = "loading";
          render(); loadResults();
        })
        .catch(function (err) {
          console.error("pool: submit failed", err);
          state.mode = "review"; state.err = true; render();
        });
    }

    function loadResults() {
      fetch(POOL_URL)
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) throw new Error("server error");
          state.data = res; state.rmode = "results";
          if (saved && !res.bets.some(function (b) { return b.name === saved.name; })) {
            // the bet was removed from the sheet (admin cleanup): free this device to bet again
            saved = null;
            try { localStorage.removeItem("bs_pool_bet"); } catch (e) {}
            if (state.mode === "done") state.mode = "intro";
            render();
          } else if (state.tab === "results") {
            render();
          }
        })
        .catch(function (err) {
          console.error("pool: loading results failed", err);
          state.rmode = "loaderr";
          if (state.tab === "results") render();
        });
    }

    // ---- results & leaderboard ----
    function scoreBet(bet, actual) {
      const s = {
        sex: bet.sex === actual.sex ? POINTS.sex : 0,
        dayNight: bet.dayNight === actual.dayNight ? POINTS.dayNight : 0,
        hair: bet.hair === actual.hair ? POINTS.hair : 0,
        eyes: bet.eyes === actual.eyes ? POINTS.eyes : 0,
        weekday: bet.weekday === actual.weekday ? POINTS.weekday : 0,
      };
      const wd = Math.abs(bet.week - actual.week);
      s.week = wd === 0 ? POINTS.week : (wd === 1 ? 1 : 0);
      const gd = Math.abs(bet.weight - actual.weight);
      s.weight = gd <= 100 ? 4 : (gd <= 250 ? 2 : (gd <= 500 ? 1 : 0));
      const ld = Math.abs(bet.length - actual.length);
      s.length = ld <= 1 ? 4 : (ld <= 2 ? 2 : (ld <= 3 ? 1 : 0));
      s.total = s.sex + s.dayNight + s.hair + s.eyes + s.weekday + s.week + s.weight + s.length;
      return s;
    }

    function isMe(bet) { return saved && bet.name === saved.name; }

    function nameCell(bet) {
      return esc(bet.name) + (isMe(bet) ? '<span class="pool-you-badge">' + t("pool_you") + "</span>" : "");
    }

    function renderResults() {
      if (state.data.actual) { renderLeaderboard(); return; }
      const bets = state.data.bets;
      const n = bets.length;
      let html = '<p class="pool-q">' + t("pool_results_h") + "</p>" +
        '<p class="pool-sub">' + t(n === 1 ? "pool_bets_one" : "pool_bets_many").replace("%1", n) + "</p>";

      html += '<div class="pool-stats">' +
        ["sex", "week", "weekday", "dayNight", "hair", "eyes"].map(function (key) {
          const step = STEPS.find(function (s) { return s.key === key; });
          return '<div class="pool-stat"><h4>' + t("pool_cat_" + key) + "</h4>" +
            '<div class="pool-bar-rows">' +
            step.options.map(function (o) {
              const count = bets.filter(function (b) { return b[key] === o.v; }).length;
              const pct = n ? Math.round(count / n * 100) : 0;
              return '<div class="pool-bar-row">' +
                '<span class="pool-bar-lbl">' + displayVal(key, o.v) + "</span>" +
                '<span class="pool-bar-track"><span class="pool-bar-fill" style="width:' + pct + '%"></span></span>' +
                '<span class="pool-bar-pct">' + pct + "%</span></div>";
            }).join("") + "</div></div>";
        }).join("") + "</div>";

      if (n) {
        const avgW = Math.round(bets.reduce(function (a, b) { return a + b.weight; }, 0) / n);
        const avgL = Math.round(bets.reduce(function (a, b) { return a + b.length; }, 0) / n);
        html += '<div class="pool-avgs" style="margin-top:22px;">' +
          '<div class="pool-avg-box"><div class="n">' + fmtWeight(avgW) + '</div><div class="l">' + t("pool_avg_weight") + "</div></div>" +
          '<div class="pool-avg-box"><div class="n">' + fmtLength(avgL) + '</div><div class="l">' + t("pool_avg_length") + "</div></div>" +
          "</div>";
      }

      html += '<h4 style="margin-top:26px; color:var(--sage-deep);">' + t("pool_all_h") + "</h4>" + betsTableHtml(bets, null);
      setContent(html);
    }

    function renderLeaderboard() {
      const actual = state.data.actual;
      const ranked = state.data.bets.map(function (b, i) {
        return { bet: b, order: i, score: scoreBet(b, actual) };
      }).sort(function (a, b) { return b.score.total - a.score.total || a.order - b.order; });

      setContent(
        '<p class="pool-q">' + t("pool_born_h") + "</p>" +
        '<div class="pool-actual">' + STEPS.map(function (s) {
          return '<div class="pool-avg-box"><div class="n">' + displayVal(s.key, actual[s.key]) + '</div><div class="l">' + t("pool_cat_" + s.key) + "</div></div>";
        }).join("") + "</div>" +
        '<p class="pool-q" style="font-size:1.25rem;">' + t("pool_lb_h") + "</p>" +
        '<p class="pool-sub">' + t("pool_lb_sub") + "</p>" +
        betsTableHtml(ranked.map(function (r) { return r.bet; }), ranked) +
        '<details class="pool-scoring"><summary>' + t("pool_scoring_h") + "</summary><p>" + t("pool_scoring_txt") + "</p></details>");
    }

    function betsTableHtml(bets, ranked) {
      const medals = [
        '<i data-lucide="trophy" class="pool-medal-1"></i>',
        '<i data-lucide="medal" class="pool-medal-2"></i>',
        '<i data-lucide="medal" class="pool-medal-3"></i>',
      ];
      const head = "<tr>" + (ranked ? "<th></th>" : "") + "<th>" + t("pool_name_col") + "</th>" +
        STEPS.map(function (s) { return "<th>" + t("pool_cat_" + s.key) + "</th>"; }).join("") +
        (ranked ? "<th>" + t("pool_total_col") + "</th>" : "") + "</tr>";
      const rows = bets.map(function (bet, i) {
        let cells = (ranked ? "<td>" + (medals[i] ? '<span class="pool-medal">' + medals[i] + "</span>" : i + 1) + "</td>" : "") +
          "<td>" + nameCell(bet) + "</td>";
        cells += STEPS.map(function (s) {
          const val = displayVal(s.key, bet[s.key]);
          if (!ranked) return "<td>" + val + "</td>";
          const pts = ranked[i].score[s.key];
          return '<td class="' + (pts ? "pts" : "zero") + '">' + val + " · " + pts + "</td>";
        }).join("");
        if (ranked) cells += '<td class="pts">' + ranked[i].score.total + "</td>";
        return '<tr class="' + (isMe(bet) ? "me" : "") + '">' + cells + "</tr>";
      }).join("");
      return '<div class="pool-table-wrap"><table class="pool-table' + (ranked ? " ranked" : "") + '">' + head + rows + "</table></div>";
    }

    document.addEventListener("langchange", render);

    if (saved && saved.name) {
      state.name = saved.name;
      state.mode = "done";
      loadResults(); // also verifies the bet still exists in the sheet
    }
    render();
  })();
</script>
</body>
</html>
